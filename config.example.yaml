embedding:
  base_url: http://localhost:11434
  model: bge-m3
  batch_size: 16

llm:
  base_url: https://api.deepseek.com/v1
  model: deepseek-chat

chunk:
  size: 500        # 字符数
  overlap: 80

store:
  path: ./data/KB-RAG.db

web:
  addr: 127.0.0.1:8080
  upload_dir: ./data/uploads
  max_upload_mb: 20
  frontend_dir: ./fronted/dist

log:
  file: ./data/logs/KB-RAG.log
